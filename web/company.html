<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>見通ダッシュボード — 会社別</title>
<link rel="stylesheet" href="assets/style.css" />
<style>
  .layout{display:flex; gap:18px; align-items:flex-start;}
  .sidebar{width:260px; flex:none; max-height:calc(100vh - 120px); overflow-y:auto;}
  .sidebar .search-input{width:100%; margin-bottom:10px;}
  .sidebar-item{
    display:block; padding:8px 10px; border-radius:7px; font-size:12.5px; color:var(--ink-2);
    text-decoration:none; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .sidebar-item:hover{background:var(--surface);}
  .sidebar-item.active{background:var(--accent-soft); color:var(--accent-ink); font-weight:600;}
  .main{flex:1; min-width:0;}
  @media (max-width:800px){ .layout{flex-direction:column;} .sidebar{width:100%; max-height:220px;} }
</style>
</head>
<body>
<div class="wrap">
  <div id="loadingScreen">読み込み中…</div>
  <div id="appRoot" style="display:none;">
    <header class="page-head"><h1>会社別</h1></header>
    <div id="emptyState" class="empty-state" style="display:none;">
      まだデータがインポートされていません。「インポート」タブから取り込んでください。
    </div>
    <div id="layout" class="layout" style="display:none;">
      <div class="sidebar">
        <input class="search-input" id="searchInput" placeholder="会社名で検索" autocomplete="new-password" />
        <div id="sidebarList"></div>
      </div>
      <div class="main">
        <div id="detail"></div>
      </div>
    </div>
  </div>
</div>

<div id="unlock-overlay">
  <div class="unlock-box">
    <h3>合言葉を入力</h3>
    <p>このダッシュボードのデータを見るには合言葉が必要です。</p>
    <input id="unlock-input" type="password" placeholder="合言葉" />
    <button id="unlock-btn">開く</button>
    <div id="unlock-error"></div>
  </div>
</div>

<script type="module">
import { loadSnapshots } from "./assets/data-client.js";
import { companySummary, companyTargetVariance, classifyProducts, KPI_DEFS, companyKpiTable, kpiSeries } from "./lib/aggregate.mjs";
import { renderBarChart, renderLineChart } from "./assets/charts.js";
import { renderKpiTable, renderPeriodRangePicker, renderKpiChartGrid, kpiSeriesHasData, defaultPeriodRange } from "./assets/kpiPanel.js";

const fmtYen = (v) => v == null ? "—" : Math.round(v).toLocaleString("ja-JP");
const fmtPct = (v) => v == null ? "—" : (v * 100).toFixed(1) + "%";
const fmtDiff = (v) => v == null ? "—" : (v >= 0 ? "+" : "") + Math.round(v).toLocaleString("ja-JP");

const ALL_KPIS = [
  { key: "stockRatio", label: "ストック比率", unit: "percent" },
  ...KPI_DEFS.map((k) => ({ key: k.key, label: k.label, unit: k.unit })),
];

let forecast, target, summary, variance, quadrantsByCompany, boundaryMonth;
let currentRange = null; // 会社を切り替えても選んだ表示期間を維持する

// Chromeの「このフィールドへの過去の入力値」の自動入力（別画面のGAS URL欄の値等を誤って
// 提案してくる）は、autocomplete="off"/"new-password"のどちらでも止めきれず、しかも1回の
// キー操作で数十文字の値を丸ごと差し込む・isTrusted:trueの本物のイベントとして発火するため、
// キー入力/貼り付けの有無では自動入力由来かを判定できない（実機で確認済み）。
// 人間が1回のキー操作/IME確定で増やせる文字数を超える急激な増加は自動入力由来とみなし、
// 貼り付け（paste）でない限り元の値に戻す。
function attachSearchGuard(input, onChange) {
  let lastGoodValue = "";
  let pasted = false;
  input.addEventListener("paste", () => { pasted = true; });
  input.addEventListener("input", (e) => {
    const v = e.target.value;
    if (!pasted && v.length - lastGoodValue.length > 20) {
      e.target.value = lastGoodValue;
      return;
    }
    pasted = false;
    lastGoodValue = v;
    onChange(v);
  });
}

// 直近12ヵ月の実績 + すべての見通月。チャートと月次テーブルはこの同じ月範囲を共有する。
function pickChartMonths(months, boundaryMonth, actualCount = 12) {
  const actual = months.filter((m) => m < boundaryMonth).slice(-actualCount);
  const forecastMonths = months.filter((m) => m >= boundaryMonth);
  return [...actual, ...forecastMonths];
}

function renderSidebar(filter = "") {
  const companies = Object.values(summary).sort((a, b) => a.name.localeCompare(b.name, "ja"));
  const q = filter.trim();
  const filtered = q ? companies.filter((c) => c.name.includes(q) || c.code.includes(q)) : companies;
  document.getElementById("sidebarList").innerHTML = filtered.map((c) => `
    <a class="sidebar-item" data-code="${c.code}" href="?code=${encodeURIComponent(c.code)}">${c.name}</a>
  `).join("") || `<div class="empty-state">該当なし</div>`;
  document.querySelectorAll(".sidebar-item").forEach((el) => {
    el.addEventListener("click", (e) => {
      e.preventDefault();
      selectCompany(el.dataset.code);
      history.replaceState(null, "", "?code=" + encodeURIComponent(el.dataset.code));
    });
  });
}

function selectCompany(code) {
  document.querySelectorAll(".sidebar-item").forEach((el) => el.classList.toggle("active", el.dataset.code === code));
  const company = summary[code];
  if (!company) {
    document.getElementById("detail").innerHTML = `<div class="empty-state">会社が見つかりません</div>`;
    return;
  }
  const months = pickChartMonths(forecast.months, boundaryMonth, 12);
  const v = variance?.[code];

  const rows = months.map((m) => {
    const mv = company.monthly[m] || {};
    const diff = v?.monthly?.[m];
    return `<tr>
      <td>${m}</td>
      <td class="num">${fmtYen(mv.sales)}</td>
      <td class="num">${fmtYen(mv.stockSales)}</td>
      <td class="num">${fmtPct(mv.stockRatio)}</td>
      <td class="num ${diff?.sales?.diff > 0 ? "pos" : diff?.sales?.diff < 0 ? "neg" : ""}">${diff ? fmtDiff(diff.sales.diff) : "—"}</td>
    </tr>`;
  }).join("");

  const products = quadrantsByCompany[code] || [];
  const productRows = products.map((p) => `
    <tr>
      <td>${p.productName}</td>
      <td>${p.productType || "—"}</td>
      <td>${p.forecast.quadrant ? `<span class="tag quad-${p.forecast.quadrant}">${p.forecast.quadrant}</span>` : "—"}</td>
    </tr>
  `).join("");

  document.getElementById("detail").innerHTML = `
    <h2 style="margin-top:0;">${company.name} <span class="n">(${code})</span></h2>
    <div class="chart-row">
      <div class="card chart-card">
        <h2>売上高（実績/見通・千円）</h2>
        <div id="companySalesChart"></div>
      </div>
      <div class="card chart-card">
        <h2>ストック比率（実績/見通）</h2>
        <div id="companyStockRatioChart"></div>
      </div>
    </div>
    <div class="card table-scroll" style="margin-bottom:16px;">
      <table class="datatable">
        <thead><tr><th>月</th><th class="num">売上高（千円）</th><th class="num">ストック売上額</th><th class="num">ストック比率</th><th class="num">対目標差異（売上）</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <div class="card" style="margin-bottom:16px;">
      <div class="kpi-section-head">
        <h2>KPI一覧（目標・実績/見通・目標差異） <span class="n" id="companyKpiMonthLabel"></span></h2>
        <div id="companyPeriodPicker"></div>
      </div>
      <div class="table-scroll"><div id="companyKpiTableEl"></div></div>
      <div id="companyKpiChartGrid"></div>
    </div>
    <h3 style="font-size:13px;">傘下商材（${products.length}件）</h3>
    <div class="card table-scroll">
      <table class="datatable">
        <thead><tr><th>商材名</th><th>契約型/習慣型</th><th>成長ステージ（見通）</th></tr></thead>
        <tbody>${productRows || `<tr><td colspan="3" class="empty-state">商材データがありません</td></tr>`}</tbody>
      </table>
    </div>
  `;

  renderBarChart(document.getElementById("companySalesChart"), {
    months,
    values: months.map((m) => company.monthly[m]?.sales ?? null),
    boundaryMonth,
    unit: "千円",
  });
  renderLineChart(document.getElementById("companyStockRatioChart"), {
    months,
    values: months.map((m) => company.monthly[m]?.stockRatio ?? null),
    boundaryMonth,
    domainMax: 1,
    seriesLabel: "ストック比率",
    extraRows: (i) => {
      const m = months[i];
      const mv = company.monthly[m] || {};
      const extra = [
        { label: "売上高", value: `${fmtYen(mv.sales)}千円` },
        { label: "ストック売上額", value: `${fmtYen(mv.stockSales)}千円` },
      ];
      const diff = v?.monthly?.[m]?.sales?.diff;
      if (diff != null) extra.push({ label: "対目標差異（売上）", value: fmtDiff(diff) });
      return extra;
    },
  });

  renderCompanyKpiSection(code);
}

/**
 * KPI一覧（①②③④⑤⑥⑧⑨⑪＋ストック比率）の期間ピッカー・テーブル・グラフグリッド。
 * 会社を切り替えても選んだ表示期間（currentRange）は維持する。
 */
function renderCompanyKpiSection(code) {
  const scope = { kind: "company", companyCode: code };
  const availableKpis = ALL_KPIS.filter((k) => kpiSeriesHasData(kpiSeries(forecast, target, scope, k.key, forecast.months)));
  const defaults = defaultPeriodRange(forecast.months, boundaryMonth);
  if (!currentRange) currentRange = defaults;

  function render(start, end) {
    currentRange = { start, end };
    const rangeMonths = forecast.months.filter((m) => m >= start && m <= end);
    const endMonth = rangeMonths.at(-1) || forecast.months.at(-1);
    document.getElementById("companyKpiMonthLabel").textContent = `(${endMonth}時点)`;
    const rows = companyKpiTable(forecast, target, code, endMonth).filter((r) => availableKpis.some((k) => k.key === r.key));
    renderKpiTable(document.getElementById("companyKpiTableEl"), rows);

    const seriesByKey = {};
    for (const k of availableKpis) seriesByKey[k.key] = kpiSeries(forecast, target, scope, k.key, rangeMonths);
    renderKpiChartGrid(document.getElementById("companyKpiChartGrid"), { kpis: availableKpis, months: rangeMonths, seriesByKey });
  }

  renderPeriodRangePicker(document.getElementById("companyPeriodPicker"), {
    months: forecast.months, defaultStart: currentRange.start, defaultEnd: currentRange.end,
    onChange: render,
  });
  render(currentRange.start, currentRange.end);
}

async function main() {
  ({ forecast, target } = await loadSnapshots());
  document.getElementById("loadingScreen").style.display = "none";
  document.getElementById("appRoot").style.display = "block";

  if (!forecast) {
    document.getElementById("emptyState").style.display = "block";
    return;
  }
  document.getElementById("layout").style.display = "flex";

  boundaryMonth = forecast.boundaryMonth || forecast.months.at(-12) || forecast.months.at(-1);
  summary = companySummary(forecast);
  variance = target ? companyTargetVariance(forecast, target) : null;

  const allQuadrants = classifyProducts(forecast, { boundaryMonth });
  quadrantsByCompany = {};
  for (const p of allQuadrants) (quadrantsByCompany[p.companyCode] ||= []).push(p);

  renderSidebar();
  attachSearchGuard(document.getElementById("searchInput"), (value) => renderSidebar(value));

  const initialCode = new URLSearchParams(location.search).get("code") || Object.keys(summary)[0];
  if (initialCode) selectCompany(initialCode);
}

main();
</script>
</body>
</html>
