<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>見通ダッシュボード — 商材別</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<div class="wrap">
  <div id="loadingScreen">読み込み中…</div>
  <div id="appRoot" style="display:none;">
    <header class="page-head"><h1>商材別</h1></header>
    <div id="emptyState" class="empty-state" style="display:none;">
      まだデータがインポートされていません。「インポート」タブから取り込んでください。
    </div>
    <div id="content" style="display:none;">
      <div class="filterbar">
        <input class="search-input" id="searchInput" placeholder="会社名・商材名で検索" autocomplete="new-password" />
        <div class="filtergroup" id="quadChips"></div>
        <span class="resetlink" id="resetLink">絞り込みを解除</span>
      </div>
      <div class="card chart-card" style="margin-bottom:16px;">
        <h2>商材ポートフォリオ分布（継続率 × 顧客増加数・見通） <span class="n" id="scatterCount"></span></h2>
        <div id="quadScatter"></div>
      </div>
      <div class="card table-scroll">
        <table class="datatable">
          <thead>
            <tr id="theadRow"></tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div id="unlock-overlay">
  <div class="unlock-box">
    <h3>合言葉を入力</h3>
    <p>このダッシュボードのデータを見るには合言葉が必要です。</p>
    <input id="unlock-input" type="password" placeholder="合言葉" />
    <button id="unlock-btn">開く</button>
    <div id="unlock-error"></div>
  </div>
</div>

<div id="product-detail-overlay">
  <div class="product-detail-panel">
    <div class="pd-head">
      <div>
        <div class="pd-title" id="pdTitle"></div>
        <div class="pd-sub" id="pdSub"></div>
      </div>
      <button class="pd-close" id="pdClose">閉じる ✕</button>
    </div>
    <div class="card" style="margin-bottom:16px;">
      <div class="kpi-section-head">
        <h2>KPI一覧（目標・実績/見通・目標差異） <span class="n" id="pdKpiMonthLabel"></span></h2>
        <div id="pdPeriodPicker"></div>
      </div>
      <div class="table-scroll"><div id="pdKpiTable"></div></div>
      <div id="pdKpiChartGrid"></div>
    </div>
  </div>
</div>

<script type="module">
import { loadSnapshots } from "./assets/data-client.js";
import { classifyProducts, productTargetVariance, productMetricSeries, METRIC, KPI_DEFS, productKpiTable, kpiSeries } from "./lib/aggregate.mjs";
import { renderQuadrantScatter, renderSparkline } from "./assets/charts.js";
import { renderKpiTable, renderPeriodRangePicker, renderKpiChartGrid, kpiSeriesHasData, defaultPeriodRange } from "./assets/kpiPanel.js";

const fmtDiff = (v) => v == null ? "—" : (v >= 0 ? "+" : "") + Math.round(v).toLocaleString("ja-JP");

const ALL_KPIS = [
  { key: "stockRatio", label: "ストック比率", unit: "percent" },
  ...KPI_DEFS.map((k) => ({ key: k.key, label: k.label, unit: k.unit })),
];

// autocomplete="off"はChromeの「このフィールドに過去入力した値」の自動入力（別画面のGAS URL欄等を
// 誤って提案してくる）を止めきれないため、autocomplete="new-password"（保存も提案も一切行われない
// 特別扱いの値）を使って提案自体を発生させない。さらに、万一何らかの経路で値が書き換わっても
// 実際のキー入力/貼り付けを伴わないinputイベントは無視して値を戻す保険をかけておく。
function attachSearchGuard(input, onChange) {
  let userEdited = false;
  input.addEventListener("keydown", () => { userEdited = true; });
  input.addEventListener("paste", () => { userEdited = true; });
  input.addEventListener("input", (e) => {
    if (!userEdited) {
      e.target.value = "";
      return;
    }
    onChange(e.target.value);
  });
}

const QUADS = ["順調成長", "積上純増", "ジレンマ", "要改善"];
const QUAD_RANK = { "順調成長": 0, "積上純増": 1, "ジレンマ": 2, "要改善": 3 };

// key: 内部識別子, label: 見出し, sortable: false ならクリック無効（スパークライン等、単一値を持たない列）
const COLUMNS = [
  { key: "companyName", label: "会社名", sortable: true, get: (r) => r.companyName },
  { key: "productName", label: "商材名", sortable: true, get: (r) => r.productName },
  { key: "productType", label: "契約型/習慣型", sortable: true, get: (r) => r.productType || "" },
  { key: "actualQuadrant", label: "成長ステージ（実績）", sortable: true, get: (r) => QUAD_RANK[r.actual.quadrant] ?? 99 },
  { key: "forecastQuadrant", label: "成長ステージ（見通）", sortable: true, get: (r) => QUAD_RANK[r.forecast.quadrant] ?? 99 },
  { key: "salesDiff", label: "対目標差異（当月・売上）", sortable: true, num: true, get: (r) => r.salesDiff },
  { key: "stockDiff", label: "対目標差異（当月・ストック）", sortable: true, num: true, get: (r) => r.stockDiff },
  { key: "trend", label: "売上トレンド", sortable: false },
];

let rows = [];
let activeQuad = null;
let forecastData = null;
let targetData = null;
let boundaryMonth = null;
let sparkMonths = [];
let sparkBoundaryIndex = -1;
let sortKey = null;
let sortDir = 1;

function renderThead() {
  document.getElementById("theadRow").innerHTML = COLUMNS.map((c) => {
    const cls = [c.num ? "num" : "", c.sortable ? "sortable" : ""].filter(Boolean).join(" ");
    const arrow = c.key === sortKey ? `<span class="sort-arrow">${sortDir > 0 ? "▲" : "▼"}</span>` : "";
    return `<th class="${cls}" data-key="${c.key}">${c.label}${arrow}</th>`;
  }).join("");
  document.querySelectorAll("#theadRow th.sortable").forEach((th) => {
    th.addEventListener("click", () => {
      const key = th.dataset.key;
      sortDir = sortKey === key ? -sortDir : 1;
      sortKey = key;
      render(document.getElementById("searchInput").value);
    });
  });
}

function sortRows(list) {
  if (!sortKey) return list;
  const col = COLUMNS.find((c) => c.key === sortKey);
  if (!col) return list;
  return [...list].sort((a, b) => {
    const av = col.get(a), bv = col.get(b);
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    const cmp = typeof av === "string" ? av.localeCompare(bv, "ja") : av - bv;
    return cmp * sortDir;
  });
}

function render(filterText = "") {
  const q = filterText.trim();
  let filtered = rows.filter((r) => {
    if (activeQuad && r.forecast.quadrant !== activeQuad) return false;
    if (!q) return true;
    return r.companyName.includes(q) || r.productName.includes(q);
  });
  filtered = sortRows(filtered);
  renderThead();
  document.getElementById("tbody").innerHTML = filtered.map((r) => `
    <tr class="product-row" data-code="${r.companyCode}" data-no="${r.productNo}" style="cursor:pointer;">
      <td>${r.companyName}</td>
      <td>${r.productName}</td>
      <td>${r.productType || "—"}</td>
      <td>${r.actual.quadrant ? `<span class="tag quad-${r.actual.quadrant}">${r.actual.quadrant}</span>` : "—"}</td>
      <td>${r.forecast.quadrant ? `<span class="tag quad-${r.forecast.quadrant}">${r.forecast.quadrant}</span>` : "—"}</td>
      <td class="num ${cls(r.salesDiff)}">${fmtDiff(r.salesDiff)}</td>
      <td class="num ${cls(r.stockDiff)}">${fmtDiff(r.stockDiff)}</td>
      <td><div class="spark-cell" data-code="${r.companyCode}" data-no="${r.productNo}"></div></td>
    </tr>
  `).join("") || `<tr><td colspan="8" class="empty-state">該当する商材がありません</td></tr>`;

  document.querySelectorAll(".spark-cell").forEach((cell) => {
    const values = productMetricSeries(forecastData, cell.dataset.code, Number(cell.dataset.no), METRIC.SALES, sparkMonths);
    renderSparkline(cell, { values, months: sparkMonths, boundaryIndex: sparkBoundaryIndex, unit: "千円" });
  });

  // 商材名クリック→KPI一覧・グラフの詳細パネルを開く（スパークラインのホバーとは独立したクリック領域）
  document.querySelectorAll(".product-row").forEach((tr) => {
    tr.addEventListener("click", (e) => {
      if (e.target.closest(".spark-cell")) return;
      openProductDetail(tr.dataset.code, Number(tr.dataset.no));
    });
  });

  document.getElementById("scatterCount").textContent = `(${filtered.length}件を表示)`;
  renderQuadrantScatter(document.getElementById("quadScatter"), {
    points: filtered.map((r) => ({
      x: r.forecast.retentionValue,
      y: r.forecast.growthValue,
      quadrant: r.forecast.quadrant,
      label: r.productName,
      sub: r.companyName,
    })),
  });
}
function cls(v) { return v > 0 ? "pos" : v < 0 ? "neg" : ""; }

function renderChips() {
  document.getElementById("quadChips").innerHTML = QUADS.map((qd) => `
    <span class="chip${activeQuad === qd ? " active" : ""}" data-q="${qd}">${qd}</span>
  `).join("");
  document.querySelectorAll(".chip").forEach((el) => {
    el.addEventListener("click", () => {
      activeQuad = activeQuad === el.dataset.q ? null : el.dataset.q;
      renderChips();
      render(document.getElementById("searchInput").value);
    });
  });
}

/** 商材1件のKPI一覧・グラフを右側のスライドオーバーパネルに表示する。 */
function openProductDetail(companyCode, productNo) {
  const row = rows.find((r) => r.companyCode === companyCode && r.productNo === productNo);
  document.getElementById("pdTitle").textContent = row?.productName || "商材";
  document.getElementById("pdSub").textContent = row ? `${row.companyName}（${row.productType || "—"}）` : "";

  const scope = { kind: "product", companyCode, productNo };
  const availableKpis = ALL_KPIS.filter((k) => kpiSeriesHasData(kpiSeries(forecastData, targetData, scope, k.key, forecastData.months)));
  const { start: defStart, end: defEnd } = defaultPeriodRange(forecastData.months, boundaryMonth);

  function render(start, end) {
    const rangeMonths = forecastData.months.filter((m) => m >= start && m <= end);
    const endMonth = rangeMonths.at(-1) || forecastData.months.at(-1);
    document.getElementById("pdKpiMonthLabel").textContent = `(${endMonth}時点)`;
    const kpiRows = productKpiTable(forecastData, targetData, companyCode, productNo, endMonth)
      .filter((r) => availableKpis.some((k) => k.key === r.key));
    renderKpiTable(document.getElementById("pdKpiTable"), kpiRows);

    const seriesByKey = {};
    for (const k of availableKpis) seriesByKey[k.key] = kpiSeries(forecastData, targetData, scope, k.key, rangeMonths);
    renderKpiChartGrid(document.getElementById("pdKpiChartGrid"), { kpis: availableKpis, months: rangeMonths, seriesByKey });
  }

  renderPeriodRangePicker(document.getElementById("pdPeriodPicker"), {
    months: forecastData.months, defaultStart: defStart, defaultEnd: defEnd,
    onChange: render,
  });
  render(defStart, defEnd);

  document.getElementById("product-detail-overlay").classList.add("open");
}

function closeProductDetail() {
  document.getElementById("product-detail-overlay").classList.remove("open");
}

document.getElementById("pdClose").addEventListener("click", closeProductDetail);
document.getElementById("product-detail-overlay").addEventListener("click", (e) => {
  if (e.target.id === "product-detail-overlay") closeProductDetail();
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeProductDetail();
});

async function main() {
  const { forecast, target } = await loadSnapshots();
  document.getElementById("loadingScreen").style.display = "none";
  document.getElementById("appRoot").style.display = "block";
  if (!forecast) {
    document.getElementById("emptyState").style.display = "block";
    return;
  }
  document.getElementById("content").style.display = "block";

  forecastData = forecast;
  targetData = target;
  boundaryMonth = forecast.boundaryMonth || forecast.months.at(-12) || forecast.months.at(-1);
  const refMonth = forecast.months.filter((m) => m < boundaryMonth).at(-1) || forecast.months.at(-1);

  const sparkActualMonths = forecast.months.filter((m) => m < boundaryMonth).slice(-8);
  const sparkForecastMonths = forecast.months.filter((m) => m >= boundaryMonth);
  sparkMonths = [...sparkActualMonths, ...sparkForecastMonths];
  sparkBoundaryIndex = sparkActualMonths.length;

  const quadrants = classifyProducts(forecast, { boundaryMonth });
  let salesVarianceByKey = {}, stockVarianceByKey = {};
  if (target) {
    for (const v of productTargetVariance(forecast, target, METRIC.SALES)) {
      salesVarianceByKey[`${v.companyCode}:${v.productNo}`] = v.monthly[refMonth];
    }
    for (const v of productTargetVariance(forecast, target, METRIC.STOCK_SALES)) {
      stockVarianceByKey[`${v.companyCode}:${v.productNo}`] = v.monthly[refMonth];
    }
  }

  rows = quadrants.map((r) => {
    const key = `${r.companyCode}:${r.productNo}`;
    return { ...r, salesDiff: salesVarianceByKey[key] ?? null, stockDiff: stockVarianceByKey[key] ?? null };
  });

  renderChips();
  render();
  attachSearchGuard(document.getElementById("searchInput"), (value) => render(value));
  document.getElementById("resetLink").addEventListener("click", () => {
    activeQuad = null;
    document.getElementById("searchInput").value = "";
    renderChips();
    render();
  });
}

main();
</script>
</body>
</html>
