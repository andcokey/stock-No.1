<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>見通ダッシュボード — 全体サマリー</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<div class="wrap">
  <div id="loadingScreen">読み込み中…</div>
  <div id="errorScreen">
    <div>読み込みに失敗しました。</div>
    <button onclick="location.reload()">再読込</button>
  </div>

  <div id="appRoot">
    <header class="page-head">
      <div>
        <h1>全体サマリー</h1>
        <div class="subtitle" id="snapshotInfo"></div>
      </div>
      <div id="refPeriodPicker"></div>
    </header>

    <div id="emptyState" class="empty-state" style="display:none;">
      まだデータがインポートされていません。<br />
      「インポート」タブから週次の見通ファイルをドラッグ&ドロップしてください。
    </div>

    <div id="content" style="display:none;">
      <div class="kpi-row" id="kpiRow"></div>

      <div class="card" style="margin-bottom:14px;">
        <div class="kpi-section-head">
          <h2>全社トレンド（目標・実績/見通）</h2>
          <div id="trendPeriodPicker"></div>
        </div>
        <div id="trendChartGrid"></div>
      </div>

      <div class="mid-row">
        <div class="card">
          <h2>会社別ランキング（売上高） <span class="n" id="rankMonthLabel"></span></h2>
          <div class="ranklist" id="rankList"></div>
        </div>
        <div class="card">
          <h2>商材ポートフォリオ（成長ステージ・見通） <span class="n" id="quadCount"></span></h2>
          <div class="quadgrid" id="quadGrid"></div>
        </div>
      </div>

      <div class="card chart-card" style="margin-bottom:22px;">
        <h2>商材ポートフォリオ分布（継続率 × 顧客増加数・見通）</h2>
        <div id="quadScatter"></div>
      </div>

      <div class="card" style="margin-bottom:16px;">
        <div class="kpi-section-head">
          <h2>全社KPI一覧（目標・実績/見通・目標差異） <span class="n" id="kpiTableMonthLabel"></span></h2>
          <div id="periodPicker"></div>
        </div>
        <div class="table-scroll"><div id="groupKpiTable"></div></div>
        <div id="groupKpiChartGrid"></div>
      </div>
    </div>
  </div>
</div>

<div id="unlock-overlay">
  <div class="unlock-box">
    <h3>合言葉を入力</h3>
    <p>このダッシュボードのデータを見るには合言葉が必要です。</p>
    <input id="unlock-input" type="password" placeholder="合言葉" />
    <button id="unlock-btn">開く</button>
    <div id="unlock-error"></div>
  </div>
</div>

<script type="module">
import { loadSnapshots, loadPreviousForecast } from "./assets/data-client.js";
import {
  companySummary, classifyProducts, QUADRANT_MAP, KPI_DEFS, groupKpiTable, kpiSeries,
  METRIC, periodMonths, periodLabel, groupTotalsForPeriod, companySalesForPeriod, productVarianceForPeriod,
} from "./lib/aggregate.mjs";
import { renderQuadrantScatter, showSharedTooltip, hideSharedTooltip } from "./assets/charts.js";
import {
  renderKpiTable, renderPeriodRangePicker, renderPointPeriodPicker, renderKpiChartGrid,
  kpiSeriesHasData, defaultPeriodRange,
} from "./assets/kpiPanel.js";

const fmtYen = (v) => v == null ? "—" : Math.round(v).toLocaleString("ja-JP");
const fmtPct = (v) => v == null ? "—" : (v * 100).toFixed(1) + "%";
const fmtDiffYen = (v) => v == null ? "—" : (v >= 0 ? "+" : "") + Math.round(v).toLocaleString("ja-JP");
const fmtDiffPct = (v) => v == null ? "—" : (v >= 0 ? "+" : "") + (v * 100).toFixed(1) + "pt";

const ALL_KPIS = [
  { key: "stockRatio", label: "ストック比率", unit: "percent" },
  ...KPI_DEFS.map((k) => ({ key: k.key, label: k.label, unit: k.unit })),
];

function pickReferenceMonth(months, boundaryMonth) {
  const actual = months.filter((m) => m < boundaryMonth);
  return actual.at(-1) || months.at(-1);
}

async function main() {
  let forecast, target;
  try {
    ({ forecast, target } = await loadSnapshots());
  } catch (e) {
    document.getElementById("loadingScreen").style.display = "none";
    document.getElementById("errorScreen").style.display = "block";
    return;
  }
  document.getElementById("loadingScreen").style.display = "none";

  if (!forecast) {
    document.getElementById("emptyState").style.display = "block";
    document.getElementById("appRoot").style.display = "block";
    return;
  }

  const boundaryMonth = forecast.boundaryMonth || forecast.months.at(-12) || forecast.months.at(-1);
  const refMonth = pickReferenceMonth(forecast.months, boundaryMonth);
  document.getElementById("snapshotInfo").textContent =
    `スナップショット日: ${forecast.snapshotDate || "-"} ／ 表示基準月: ${refMonth}`;

  const summary = companySummary(forecast);
  const companyList = Object.values(summary);

  // 前週差異用: 直近の1つ前の日付スナップショットを取得（無ければ以降のバッジは非表示になる正常系）。
  const prevForecast = await loadPreviousForecast(forecast.snapshotDate);

  function diffOf(a, b) {
    return a == null || b == null ? null : a - b;
  }

  function diffBadge(cls, fmt, prefix, value) {
    if (value == null) return "";
    const sign = value > 0 ? "pos" : value < 0 ? "neg" : "";
    return `<div class="kpi-diff ${cls} ${sign}">${prefix} ${fmt(value)}</div>`;
  }

  // 商材ごとの目標差異TOP5/WORST5ツールチップ（売上高・ストック売上額タイルのみ）。
  function attachVarianceTooltip(el, { metric, valueLabel, months, title }) {
    const rows = productVarianceForPeriod(forecast, target, metric, months);
    const sorted = [...rows].sort((a, b) => b.diff - a.diff);
    const top5 = sorted.slice(0, 5);
    const worst5 = sorted.slice(-5).reverse();

    function renderRows(list) {
      if (!list.length) return `<tr><td colspan="4">データなし</td></tr>`;
      return list.map((r) => `
        <tr>
          <td>${r.productName}</td>
          <td>${r.companyName}</td>
          <td class="num">${fmtYen(r.actual)}</td>
          <td class="num ${r.diff > 0 ? "pos" : r.diff < 0 ? "neg" : ""}">${fmtDiffYen(r.diff)}</td>
        </tr>`).join("");
    }

    function section(tip, label, list) {
      const head = document.createElement("div");
      head.className = "tt-sub";
      head.textContent = label;
      tip.appendChild(head);
      const table = document.createElement("table");
      table.className = "tt-varitable";
      table.innerHTML = `
        <thead><tr><th>商材名</th><th>会社名</th><th>${valueLabel}</th><th>目標差異</th></tr></thead>
        <tbody>${renderRows(list)}</tbody>
      `;
      tip.appendChild(table);
    }

    function show(e) {
      showSharedTooltip(e.clientX, e.clientY, (tip) => {
        tip.classList.add("variance-tooltip");
        const titleEl = document.createElement("div");
        titleEl.className = "tt-title";
        titleEl.textContent = title;
        tip.appendChild(titleEl);
        section(tip, "目標差異 TOP5", top5);
        section(tip, "目標差異 WORST5", worst5);
      });
    }
    function hide() {
      hideSharedTooltip();
    }
    el.addEventListener("pointerenter", show);
    el.addEventListener("pointermove", show);
    el.addEventListener("pointerleave", hide);
  }

  // 全体サマリー冒頭（売上高・ストック売上額・ストック比率・ランキング）を表示基準（単月/年間合計）で描く。
  // 対目標・前週差異は既存のcompanySummary/groupTotalsForPeriodと同じ計算方法を使い、
  // タイルの数値本体とバッジの間で計算方法がずれないようにする。
  function renderTopSection(period) {
    const months = periodMonths(forecast.months, period);
    const actualTotals = groupTotalsForPeriod(forecast, period);
    const targetTotals = groupTotalsForPeriod(target, period);
    const prevTotals = groupTotalsForPeriod(prevForecast, period);

    const salesBadges =
      diffBadge("target", fmtDiffYen, "対目標", diffOf(actualTotals.sales, targetTotals.sales)) +
      diffBadge("week", fmtDiffYen, "前週比", diffOf(actualTotals.sales, prevTotals.sales));
    const stockBadges =
      diffBadge("target", fmtDiffYen, "対目標", diffOf(actualTotals.stockSales, targetTotals.stockSales)) +
      diffBadge("week", fmtDiffYen, "前週比", diffOf(actualTotals.stockSales, prevTotals.stockSales));
    const ratioBadges =
      diffBadge("target", fmtDiffPct, "対目標", diffOf(actualTotals.stockRatio, targetTotals.stockRatio)) +
      diffBadge("week", fmtDiffPct, "前週比", diffOf(actualTotals.stockRatio, prevTotals.stockRatio));

    document.getElementById("kpiRow").innerHTML = `
      <div class="card${target ? " kpi-hoverable" : ""}" id="tileSales"><div class="kpi-label">売上高（千円）</div><div class="kpi-value">${fmtYen(actualTotals.sales)}</div>${salesBadges}</div>
      <div class="card${target ? " kpi-hoverable" : ""}" id="tileStock"><div class="kpi-label">ストック売上額（千円）</div><div class="kpi-value">${fmtYen(actualTotals.stockSales)}</div>${stockBadges}</div>
      <div class="card"><div class="kpi-label">ストック比率</div><div class="kpi-value">${fmtPct(actualTotals.stockRatio)}</div>${ratioBadges}</div>
      <div class="card"><div class="kpi-label">取り込み会社数</div><div class="kpi-value">${companyList.length}<small>社</small></div></div>
    `;

    if (target) {
      attachVarianceTooltip(document.getElementById("tileSales"), {
        metric: METRIC.SALES, valueLabel: "売上高",
        months, title: `売上高 目標差異ランキング（${periodLabel(period)}）`,
      });
      attachVarianceTooltip(document.getElementById("tileStock"), {
        metric: METRIC.STOCK_SALES, valueLabel: "ストック売上額",
        months, title: `ストック売上額 目標差異ランキング（${periodLabel(period)}）`,
      });
    }

    document.getElementById("rankMonthLabel").textContent = `(${periodLabel(period)})`;
    const ranked = companyList
      .map((c) => ({ ...c, sales: companySalesForPeriod(c, period, forecast.months) }))
      .sort((a, b) => b.sales - a.sales)
      .slice(0, 12);
    const maxSales = ranked[0]?.sales || 1;
    document.getElementById("rankList").innerHTML = ranked.map((c, i) => `
      <a class="rankrow" href="#" data-code="${c.code}">
        <span class="idx">${i + 1}</span>
        <span class="name">${c.name}</span>
        <span class="bartrack"><span class="barfill" style="width:${(c.sales / maxSales * 100).toFixed(1)}%"></span></span>
        <span class="amt">${fmtYen(c.sales)}</span>
      </a>
    `).join("") || `<div class="empty-state">データがありません</div>`;

    document.querySelectorAll(".rankrow").forEach((el) => {
      el.addEventListener("click", (e) => {
        e.preventDefault();
        parent.postMessage({ type: "open-company", code: el.dataset.code }, "*");
      });
    });
  }

  let currentPeriod = { type: "month", value: refMonth };
  renderPointPeriodPicker(document.getElementById("refPeriodPicker"), {
    months: forecast.months, defaultPeriod: currentPeriod,
    onChange: (period) => { currentPeriod = period; renderTopSection(period); },
  });
  renderTopSection(currentPeriod);

  // 全社合計の月次トレンド（売上高・ストック比率）。下部の全社KPI一覧と同じ
  // 「目標(破線)・実績/見通(実線)」比較グラフ＋期間/Y軸レンジ選択を、この上部サマリーにも適用する。
  function groupTotalsSeries(parsed, months) {
    if (!parsed) return { sales: months.map(() => null), stockRatio: months.map(() => null) };
    const companies = Object.values(companySummary(parsed));
    const sales = [], stockRatio = [];
    for (const m of months) {
      let s = 0, st = 0, any = false;
      for (const c of companies) {
        const mv = c.monthly[m];
        if (!mv) continue;
        any = true;
        s += mv.sales || 0;
        st += mv.stockSales || 0;
      }
      sales.push(any ? s : null);
      stockRatio.push(any && s ? st / s : null);
    }
    return { sales, stockRatio };
  }

  const TREND_KPIS = [
    { key: "sales", label: "売上高（千円）", unit: "yen" },
    { key: "stockRatio", label: "ストック比率", unit: "percent" },
  ];

  function renderTrendSection(start, end) {
    const rangeMonths = forecast.months.filter((m) => m >= start && m <= end);
    const actualTotals = groupTotalsSeries(forecast, rangeMonths);
    const targetTotals = groupTotalsSeries(target, rangeMonths);
    renderKpiChartGrid(document.getElementById("trendChartGrid"), {
      kpis: TREND_KPIS,
      months: rangeMonths,
      seriesByKey: {
        sales: { actual: actualTotals.sales, target: targetTotals.sales },
        stockRatio: { actual: actualTotals.stockRatio, target: targetTotals.stockRatio },
      },
      primaryKey: "stockRatio",
    });
  }

  const trendRange = defaultPeriodRange(forecast.months, boundaryMonth);
  renderPeriodRangePicker(document.getElementById("trendPeriodPicker"), {
    months: forecast.months, defaultStart: trendRange.start, defaultEnd: trendRange.end,
    onChange: renderTrendSection,
  });
  renderTrendSection(trendRange.start, trendRange.end);

  const quadrants = classifyProducts(forecast, { boundaryMonth });
  const counts = { 順調成長: 0, 積上純増: 0, ジレンマ: 0, 要改善: 0 };
  for (const p of quadrants) if (p.forecast.quadrant) counts[p.forecast.quadrant]++;
  const classified = Object.values(counts).reduce((a, b) => a + b, 0);
  document.getElementById("quadCount").textContent = `(${classified}/${quadrants.length}商材を分類)`;
  const cellClass = { 順調成長: "growth", 積上純増: "", ジレンマ: "dilemma", 要改善: "improve" };
  document.getElementById("quadGrid").innerHTML = Object.entries(counts).map(([name, n]) => `
    <div class="quadcell ${cellClass[name]}">
      <div class="qname">${name}</div>
      <div class="qcount">${n}<small style="font-size:12px;color:var(--ink-muted);">商材</small></div>
    </div>
  `).join("");

  renderQuadrantScatter(document.getElementById("quadScatter"), {
    points: quadrants.map((p) => ({
      x: p.forecast.retentionValue,
      y: p.forecast.growthValue,
      quadrant: p.forecast.quadrant,
      label: p.productName,
      sub: p.companyName,
    })),
  });

  // 全社KPI一覧: ①②③④⑤⑥⑧⑨⑪＋ストック比率。実績・目標ともに全期間データが無いKPIはグラフ・表から外す
  // （⑦アップセル・クロスセル数／⑩NRRは元テンプレートに項目が無いためKPI_DEFSに含まれておらず、常に対象外）。
  const groupScope = { kind: "group" };
  const availableKpis = ALL_KPIS.filter((k) => kpiSeriesHasData(kpiSeries(forecast, target, groupScope, k.key, forecast.months)));
  const { start: defStart, end: defEnd } = defaultPeriodRange(forecast.months, boundaryMonth);

  function renderGroupKpiSection(start, end) {
    const rangeMonths = forecast.months.filter((m) => m >= start && m <= end);
    const endMonth = rangeMonths.at(-1) || refMonth;
    document.getElementById("kpiTableMonthLabel").textContent = `(${endMonth}時点)`;
    const rows = groupKpiTable(forecast, target, endMonth).filter((r) => availableKpis.some((k) => k.key === r.key));
    renderKpiTable(document.getElementById("groupKpiTable"), rows);

    const seriesByKey = {};
    for (const k of availableKpis) seriesByKey[k.key] = kpiSeries(forecast, target, groupScope, k.key, rangeMonths);
    renderKpiChartGrid(document.getElementById("groupKpiChartGrid"), { kpis: availableKpis, months: rangeMonths, seriesByKey });
  }

  renderPeriodRangePicker(document.getElementById("periodPicker"), {
    months: forecast.months, defaultStart: defStart, defaultEnd: defEnd,
    onChange: renderGroupKpiSection,
  });
  renderGroupKpiSection(defStart, defEnd);

  document.getElementById("content").style.display = "block";
  document.getElementById("appRoot").style.display = "block";
}

main();
</script>
</body>
</html>
